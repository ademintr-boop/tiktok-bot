name: 🔑 Авторизация TikTok

# Запуск 1: поле code пустое → в отчёте запуска появится ссылка авторизации.
# Запуск 2: вставьте код со страницы-приёмника → бот сохранит токен в секреты.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Код авторизации (оставьте пустым, чтобы получить ссылку)"
        required: false
        default: ""
  push:
    paths: [".auth", ".auth_code", ".revoke"]

permissions:
  contents: write

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - name: Авторизация
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ vars.TIKTOK_REDIRECT_URI || 'https://ademintr-boop.github.io/tiktok-bot/callback.html' }}
          CODE: ${{ inputs.code }}
        run: |
          mkdir -p reports
          if [ -s .revoke ]; then
            python -m bot.main auth-revoke 2>&1 | grep -v '::add-mask::' > reports/auth_log.txt || true
            : > .revoke
            git rm -q --cached data/tiktok_token.enc 2>/dev/null || true
          fi
          if [ -z "$CODE" ] && [ -s .auth_code ]; then CODE=$(tr -d ' \n\r' < .auth_code); fi
          if [ -z "$CODE" ]; then
            mkdir -p reports
            python -m bot.main auth-url 2>&1 | grep -v '::add-mask::' > reports/auth_log.txt || true
            grep -o 'https://www.tiktok.com/v2/auth/authorize/[^ ]*' reports/auth_log.txt | tail -1 > reports/auth_url.txt || true
            cat reports/auth_log.txt
          else
            echo "::add-mask::$CODE"
            python -m bot.main auth-exchange "$CODE" 2>&1 | tee /dev/stderr | grep -v '::add-mask::' > reports/auth_log.txt || true
            : > .auth_code
          fi
      - name: Сохранить
        if: always()
        run: |
          git config user.name "tiktok-bot"
          git config user.email "tiktok-bot@users.noreply.github.com"
          mkdir -p reports; for f in data/tiktok_token.enc reports/auth_url.txt reports/auth_log.txt .auth_code .revoke; do [ -f "$f" ] && git add "$f"; done; true
          [ -f data/tiktok_token.enc ] || git rm -q --cached data/tiktok_token.enc 2>/dev/null || true
          git diff --cached --quiet || git commit -m "bot: токен TikTok (зашифрован)"
          git pull --rebase -q && git push -q
