name: 🎬 Публикация ролика

on:
  schedule:
    # Время в UTC. 06:17 и 15:47 UTC = 09:17 и 18:47 по Стамбулу/Москве
    - cron: "17 6 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch: {}
  # Ручной запуск через коммит: измените файл .run (так его может запускать и Claude)
  push:
    paths: [".run"]

permissions:
  contents: write

concurrency:
  group: tiktok-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка ffmpeg и шрифтов
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Сгенерировать и опубликовать
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python -m bot.main run 2>&1 | tee run.log

      - name: Превью кадров
        if: always()
        run: |
          V=$(ls out/*/video.mp4 2>/dev/null | head -1)
          if [ -n "$V" ]; then
            mkdir -p reports
            ffmpeg -v error -y -ss 1 -i "$V" -frames:v 1 -vf scale=270:-1 f1.png
            ffmpeg -v error -y -ss 12 -i "$V" -frames:v 1 -vf scale=270:-1 f2.png
            ffmpeg -v error -y -ss 25 -i "$V" -frames:v 1 -vf scale=270:-1 f3.png
            ffmpeg -v error -y -i f1.png -i f2.png -i f3.png -filter_complex hstack=3 -q:v 4 reports/preview.jpg
          fi

      - name: Журнал запуска (без секретов)
        if: always()
        env:
          S1: ${{ secrets.ANTHROPIC_API_KEY }}
          S2: ${{ secrets.PEXELS_API_KEY }}
          S3: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          S4: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import os, re
          log = open("run.log", encoding="utf-8", errors="replace").read() if os.path.exists("run.log") else "нет журнала"
          for k in ("S1", "S2", "S3", "S4"):
              v = os.environ.get(k)
              if v and len(v) > 6:
                  log = log.replace(v, "***")
          log = re.sub(r"(sk-ant-|act\.|rft\.|github_pat_|ghp_)[A-Za-z0-9_\-\.!*]+", r"\1***", log)
          open("reports/last_run.log", "w", encoding="utf-8").write(log[-20000:])
          PY

      - name: Сохранить ролик (доступен 14 дней во вкладке Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/*/video.mp4
            out/*/caption.txt
            out/*/story.json
            out/*/subs.srt
          if-no-files-found: ignore
          retention-days: 14

      - name: Сохранить историю и отчёт
        if: always()
        run: |
          git config user.name "tiktok-bot"
          git config user.email "tiktok-bot@users.noreply.github.com"
          git add data reports 2>/dev/null || true
          git diff --cached --quiet || git commit -m "bot: публикация $(date -u +%F_%H%M)"
          git pull --rebase -q && git push -q || true
